spring.application.name=cart-service
	
server.port= 8052
	
spring.datasource.url=jdbc:mysql://localhost:3306/cartms?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Finastra123$

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.register-with-eureka=true 
eureka.client.fetch-registry=true 
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

logging.level.com.netflix.eureka=OFF
logging.level.com.netflix.discovery=OFF

#Tracing 
logging.pattern.level= '%Sp [${spring.application.name:},%X{traceId:-},%X{spanId:-}]'

#ZIPKIN
management.zipkin.tracing.endpoint= localhost:9411/api/v2/spans
management.tracing.sampling.probability=1.0